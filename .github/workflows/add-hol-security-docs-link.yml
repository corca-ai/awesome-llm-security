name: Add canonical HOL Guard security link

on:
  push:
    branches:
      - add-hol-guard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: add-hol-guard

      - name: Add the canonical security documentation link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "- [HOL Guard](https://github.com/hashgraph-online/hol-guard): local-first security harness that intercepts tool calls in AI coding agents (Codex, Claude Code, Cursor, Gemini, Copilot CLI, Hermes, OpenCode) before files change or network is contacted ![GitHub Repo stars](https://img.shields.io/github/stars/hashgraph-online/hol-guard?style=social)"
          new = "- [HOL Guard](https://github.com/hashgraph-online/hol-guard): local-first security harness that intercepts tool calls in AI coding agents before files change or network is contacted ([security docs](https://hol.org/guard/security)). ![GitHub Repo stars](https://img.shields.io/github/stars/hashgraph-online/hol-guard?style=social)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one HOL Guard entry, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit the one-line change and remove this transport workflow
        run: |
          rm .github/workflows/add-hol-security-docs-link.yml
          git config user.name "Michael Kantor"
          git config user.email "michael@hol.org"
          git add README.md .github/workflows/add-hol-security-docs-link.yml
          git diff --cached --check
          git commit -m "Add HOL Guard security documentation link"
          git push origin HEAD:add-hol-guard
