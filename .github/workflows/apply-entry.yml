name: apply-entry
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply entry insertion
        run: |
          python3 - << 'PYEOF'
          import io, sys
          path = "README.md"
          anchor_key = "splx-ai/agentic-radar"
          entry = "- [DeepSeek Exposure Scan](https://github.com/dylanXM/deepseek-scanner): an open-source CLI that scans a codebase for DeepSeek components — API endpoints, SDK imports, dependency entries, and model artifacts — and generates an evidence report for supplier disclosure. ![GitHub Repo stars](https://img.shields.io/github/stars/dylanXM/deepseek-scanner?style=social)"
          with io.open(path, encoding="utf-8") as f:
              lines = f.read().split("\n")
          if any("dylanXM/deepseek-scanner" in ln for ln in lines):
              print("already present")
              sys.exit(0)
          idx = [i for i, ln in enumerate(lines) if anchor_key in ln]
          assert len(idx) == 1, "anchor count %s" % len(idx)
          lines.insert(idx[0] + 1, entry)
          with io.open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(lines))
          print("inserted")
          PYEOF
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-entry.yml
          git add -A
          git commit -m "Add DeepSeek Exposure Scan to Tools"
          git push
